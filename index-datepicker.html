<!DOCTYPE html>
<html>
    <head>
        <title>Spotify Page</title>
        <style>
            *{
    margin: 0;
    padding: 0;
}

body{
    background: #131B2B;
    display: flex;
    margin-top: 20px;
    padding: 30px;
    justify-content: center;
    color: #D46743;
}

main{
    text-align: center;
    background: #2F4A63;
    padding: 10px;
    height: 220px;
    width: 200px;
}

table{
    background: #5B91A3;
    height: 150px;
    width: 100%;
}

input{
    padding: 8px;
    border: 1px solid #000000;
    font-weight: 600;
    color: #167D8D;
}

.month{
    padding: 2px;
}

.calendar{
    padding: 2px;
}

.calender table{
    background: black;
    border-collapse: collapse;
    width: 100%;
}

.caltr{
    text-align: center;
    background: white;
    border-left: 4px solid #000000;
    border-right: 4px solid #000000;
}
        </style>
    </head>

    <body>
        <main>
            <section class="input">
                <span>
                   <form>
                    <input type="date">
                   </form>
                </span>
            </section>

            <section class="month">
                <span></span>
                <span>December 2026</span>
                <span></span>
            </section>

            <section class="calendar">
                <table>
                    <tr class="caltr">
                        <th>S</th>
                        <th>M</th>
                        <th>T</th>
                        <th>W</th>
                        <th>T</th>
                        <th>F</th>
                        <th>S</th>
                    </tr>

                    <tr class="caltr">
                        <td></td>
                        <td></td>
                        <td>1</td>
                        <td>2</td>
                        <td>3</td>
                        <td>4</td>
                        <td>5</td>
                        </tr>

                        <tr class="caltr">
                        <td>6</td>
                        <td>7</td>
                        <td>8</td>
                        <td>9</td>
                        <td>10</td>
                        <td>11</td>
                        <td>12</td>
                        </tr>

                        <tr class="caltr">
                        <td>13</td>
                        <td>14</td>
                        <td>15</td>
                        <td>16</td>
                        <td>17</td>
                        <td>18</td>
                        <td>19</td>
                        </tr>

                        <tr class="caltr">
                        <td>20</td>
                        <td>21</td>
                        <td>22</td>
                        <td>23</td>
                        <td>24</td>
                        <td>25</td>
                        <td>26</td>
                        </tr>

                        <tr class="caltr">
                        <td>27</td>
                        <td>28</td>
                        <td>29</td>
                        <td>30</td>
                        <td>31</td>
                        <td></td>
                        <td></td>
                        </tr>
                </table>
            </section>
        </main>

    </body>
</html>
